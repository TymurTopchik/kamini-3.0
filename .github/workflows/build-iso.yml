name: Build Kaming OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged   # Обязательно для работы mkarchiso

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install archiso and dependencies
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed --assume-installed libcrypto.so=3-64 --assume-installed libssl.so=3-64 archiso

      - name: Make script executable
        run: chmod +x ./scripts/build-iso.sh

      - name: Build ISO
        run: bash ./scripts/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaming-os-iso
          path: out/*.iso
