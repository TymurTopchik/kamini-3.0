name: Build Kaming OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged   # Обязательно для работы archiso

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO with mkarchiso action
        uses: coderadu/actions-mkarchiso@v1
        # По умолчанию использует профиль 'releng', который стабильнее
        # чем 'baseline'. Если нужен свой профиль, укажите его в параметрах.

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaming-os-iso
          path: out/*.iso
